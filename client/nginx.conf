server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Upstreams are held in variables so nginx re-resolves them; a literal
  # proxy_pass resolves once at startup and keeps a dead IP after the API container is recreated.
  resolver 127.0.0.11 valid=10s;

  # Same paths as the dev proxy (proxy.conf.json).
  location /api/ {
    set $api http://api:3000;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /ai/ {
    set $ai http://ai-service:4010;
    rewrite ^/ai/(.*)$ /$1 break;
    proxy_pass $ai;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
