<header class="page-head"><div><p class="eyebrow">Tenant administration</p><h1 class="page-title">Administration</h1><p class="muted">Create users and manage outbound webhook delivery.</p></div></header><div class="split"><form class="panel card form-grid" [formGroup]="userForm" (ngSubmit)="createUser()"><h2>Create user</h2><div class="field"><label for="user-name">Full name</label><input id="user-name" formControlName="name"></div><div class="field"><label for="user-email">Email</label><input id="user-email" type="email" formControlName="email"></div><div class="field"><label for="user-password">Temporary password</label><input id="user-password" type="password" formControlName="password"></div><div class="field"><label for="user-role">Role</label><select id="user-role" formControlName="role"><option value="REQUESTER">Requester</option><option value="APPROVER">Approver</option><option value="PROCUREMENT">Procurement</option><option value="ADMIN">Admin</option></select></div><button class="button" type="submit" [disabled]="userForm.invalid">Create user</button></form>
<form class="panel card form-grid" [formGroup]="webhookForm" (ngSubmit)="saveWebhook()"><h2>Tenant webhook</h2>@if (webhook$ | async; as webhook) {<p class="muted">Current URL: {{ webhook.url || 'Not configured' }}</p>}<div class="field"><label for="webhook-url">HTTPS endpoint</label><input id="webhook-url" type="url" formControlName="url" placeholder="https://example.com/hooks/procurement"></div><label class="check"><input type="checkbox" formControlName="rotateSecret"> Rotate signing secret</label><button class="button" type="submit">Save webhook</button>@if (secret()) {<div class="secret"><b>Copy this secret now</b><code>{{ secret() }}</code><small>It will not be shown again.</small></div>}</form></div>
