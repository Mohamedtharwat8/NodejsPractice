<header class="page-head"><div><p class="eyebrow">Inbox</p><h1 class="page-title">Notifications</h1><p class="muted">Updates on requests, decisions, and purchase orders.</p></div><button class="button secondary" type="button" (click)="readAll()">Mark all read</button></header><section class="panel data-list">@if (notifications$ | async; as page) {@if (!page.data.length) {<p class="empty-state">No notifications yet.</p>}@for (notification of page.data; track notification.id) {<button class="data-row note" type="button" [class.unread]="!notification.readAt" (click)="read(notification.id)"><i></i><div><b>{{ notification.title }}</b><small>{{ notification.type }} · {{ notification.createdAt | date:'medium' }}</small></div><span>{{ notification.readAt ? 'Read' : 'Mark read' }}</span></button>}}</section>
